<style>
:root{
  --bg:#0b1026;--fg:#eaf2ff;--gold:#ffd86b;--teal:#5eead4;--pink:#ff6b9d;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{--bg:#0b1026;--fg:#eaf2ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 80% at 50% 0,#1a2352,var(--bg));
  color:var(--fg);
  font:15px Tahoma,"Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;
}
#hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px}
#hud div{display:flex;align-items:baseline;gap:5px}
#hud b{font-size:20px;color:var(--gold)}
#hud small{opacity:.7;font-size:12px}
#hp{color:var(--pink);font-size:18px;letter-spacing:2px}
#hud-actions{display:flex;gap:6px;align-items:center}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#mu,#home{
  background:#ffffff18;border-radius:50%;width:38px;height:38px;font-size:17px;
  display:grid;place-items:center;text-decoration:none;color:inherit;
  border:0;cursor:pointer;transition:background .2s;
}
#mu:hover,#home:hover{background:#ffffff2a}
#bar{height:5px;margin:0 14px;background:#ffffff14;border-radius:3px;overflow:hidden}
#bi{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--teal),var(--gold))}
#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#060a1ccc;padding:16px;text-align:center;
}
#ov[hidden]{display:none}
.card{max-width:340px;width:100%}

  display:block;width:100%;padding:14px;margin:9px 0;border-radius:16px;

  color:#05122b;border:0;cursor:pointer;
}

  position:absolute;bottom:14px;left:0;right:0;text-align:center;
  opacity:.85;pointer-events:none;transition:opacity .6s;font-size:14px;
}
#ad{
  flex:none;width:100%;max-width:728px;height:50px;margin:4px auto 0;
  display:flex;align-items:center;justify-content:center;
  border:1px dashed #ffffff44;border-radius:8px;font-size:12px;opacity:.75;overflow:hidden;
}
@media (min-width:740px){#ad{height:90px}}
*:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<body>
<div id="hud">
  <div><b id="sc">۰</b><small>امتیاز</small></div>
  <div><small>مرحله</small><b id="lv">۱</b></div>
  <div id="hp"></div>
  <div id="hud-actions">
    <button id="mu" type="button" aria-label="صدا">🔊</button>
    <a id="home" href="./index.html" aria-label="بازگشت به صفحه اصلی" title="خانه">🏠</a>
  </div>
</div>
<div id="bar"><i id="bi"></i></div>
<div id="stage">
  <canvas id="c" aria-label="صحنه بازی شب‌تاب ریسمان"></canvas>
  <div id="hint">انگشتت را در راستای ریسمان بکش؛ جلو یا عقب</div>
  <div id="ov"></div>
</div>
<!-- اسلات تبلیغ: کد تبلیغ خود را داخل این div قرار دهید -->
<div id="ad" role="complementary" aria-label="تبلیغات"><span>جای بنر تبلیغاتی</span></div>

<noscript>
  <div style="padding:20px;text-align:center">این بازی برای اجرا نیاز به جاوااسکریپت دارد.</div>
</noscript>

<script>
'use strict';
const $=id=>document.getElementById(id),
  cv=$('c'), cx=cv.getContext('2d'),
  fa=n=>Math.round(n).toLocaleString('fa-IR'),
  R=Math.random,
  K=(x,a,b)=>Math.max(a,Math.min(b,x)),
  RM=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ===== قلاب‌های تبلیغات (اینجا به شبکه تبلیغاتی خود وصل کنید) ===== */
const AdHooks = {
  rewarded(cb){ setTimeout(cb, 1200); },
  interstitial(){ /* کد تبلیغ میان‌مرحله‌ای */ }
};

let W,H,D=[],CL=[],TL=1,G=[],S=[],ctl=[],P={x:0,y:0},PR=9,OR=18;
let mode='menu',lv=1,sc=0,lives=3,en=1,s=0,v=0,combo=0,inv=0,t=0,kv=0,
    drag=null,tr=[],pa=[],best=0,moved=0,rv=0,games=0;
try{ best=+localStorage.getItem('shabtab')||0 }catch(e){}

const BG=Array.from({length:40},()=>[R(),R(),R()*6,1+R()*2,1+R()*2]);

/* ===== صدا ===== */
let AC=null,MG=null,hum=null,hg=null,mute=false;
function ia(){
  if(AC){ if(AC.state==='suspended'&&!mute) AC.resume(); return; }
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    MG=AC.createGain(); MG.gain.value=mute?0:.6; MG.connect(AC.destination);
    [[110,.05],[165,.03],[220,.02]].forEach(([f,g])=>{
      const o=AC.createOscillator(), x=AC.createGain();
      o.frequency.value=f; x.gain.value=g;
      o.connect(x); x.connect(MG); o.start();
    });
    hum=AC.createOscillator(); hg=AC.createGain();
    hum.type='triangle'; hg.gain.value=0;
    hum.connect(hg); hg.connect(MG); hum.start();
  }catch(e){ AC=null; MG=null; hum=null; hg=null; }
}
function nt(i,d=.45,ty='sine',vo=.22){
  if(!AC||mute) return;
  try{
    const n=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.type=ty;
    o.frequency.value=262*Math.pow(2,([0,2,4,7,9][i%5]+12*Math.floor(i/5))/12);
    g.gain.setValueAtTime(.0001,n);
    g.gain.exponentialRampToValueAtTime(vo,n+.015);
    g.gain.exponentialRampToValueAtTime(.0001,n+d);
    o.connect(g); g.connect(MG); o.start(n); o.stop(n+d+.05);
  }catch(e){}
}
function boom(){
  if(!AC||mute) return;
  try{
    const n=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(220,n);
    o.frequency.exponentialRampToValueAtTime(40,n+.5);
    g.gain.setValueAtTime(.3,n);
    g.gain.exponentialRampToValueAtTime(.0001,n+.5);
    o.connect(g); g.connect(MG); o.start(n); o.stop(n+.55);
  }catch(e){}
}
$('mu').onclick=()=>{
  mute=!mute; ia();
  if(MG) MG.gain.value=mute?0:.6;
  $('mu').textContent=mute?'🔇':'🔊';
};
document.addEventListener('visibilitychange',()=>{
  if(!AC) return;
  if(document.hidden){ drag=null; kv=0; if(AC.state==='running') AC.suspend(); }
  else if(!mute) AC.resume();
});

/* ===== مسیر ===== */
function pos(sv){
  const T=K(sv,0,1)*TL;
  let lo=0, hi=CL.length-1;
  while(hi-lo>1){ const m=(lo+hi)>>1; CL[m]<T?lo=m:hi=m; }
  const a=D[lo], b=D[hi],
        f=(T-CL[lo])/((CL[hi]-CL[lo])||1),
        dx=b[0]-a[0], dy=b[1]-a[1],
        l=Math.hypot(dx,dy)||1;
  return {x:a[0]+dx*f, y:a[1]+dy*f, tx:dx/l, ty:dy/l};
}
function ly(){
  const m=Math.min(W,H);
  PR=K(m*.022,8,11); OR=K(m*.045,14,22);
  const c=ctl.map(p=>[p[0]*W, p[1]*H]);
  D=[];
  for(let i=0;i<c.length-1;i++){
    const a=c[i-1]||c[i], b=c[i], e=c[i+1], f=c[i+2]||e;
    for(let j=0;j<20;j++){
      const u=j/20, u2=u*u, u3=u2*u;
      D.push([0,1].map(k=>
        .5*(2*b[k]+(e[k]-a[k])*u+(2*a[k]-5*b[k]+4*e[k]-f[k])*u2+(3*b[k]-a[k]-3*e[k]+f[k])*u3)
      ));
    }
  }
  D.push(c[c.length-1]);
  CL=[0];
  for(let i=1;i<D.length;i++)
    CL[i]=CL[i-1]+Math.hypot(D[i][0]-D[i-1][0], D[i][1]-D[i-1][1]);
  TL=CL[CL.length-1];
  G.forEach(g=>{ Object.assign(g,pos(g.s)); g.A=(PR+OR)*(1.75-Math.min(lv,8)*.03); });
  S.forEach(q=>Object.assign(q,pos(q.s)));
}
function nl(){
  const n=Math.min(4+Math.floor(lv/2),6);
  ctl=[];
  for(let i=0;i<n;i++)
    ctl.push([(i%2?.82:.18)+(R()-.5)*.1, .92-i*.84/(n-1)+(R()-.5)*.03]);
  const ng=Math.min(2+lv,10), sg=.8/ng;
  G=[]; S=[];
  for(let i=0;i<ng;i++){
    const a=.1+sg*i;
    G.push({s:a+sg*.6, w:1.5+lv*.12+R()*.9, p:R()*6.28, ox:0, oy:0});
    [.12,.32,.85].forEach(k=>S.push({s:a+sg*k, got:0}));
  }
  ly();
}
function rs(){
  const r=cv.parentNode.getBoundingClientRect();
  W=r.width; H=r.height;
  const d=Math.min(devicePixelRatio||1,2);
  cv.width=W*d; cv.height=H*d;
  cx.setTransform(d,0,0,d,0,0);
  if(ctl.length) ly();
}
addEventListener('resize',rs,{passive:true});

/* ===== جلوه‌ها ===== */
function burst(x,y,c){
  const n=RM?4:9;
  for(let i=0;i<n;i++){
    const a=R()*6.28, sp=40+R()*90;
    pa.push({x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, l:.6, c});
  }
}
function pop(x,y,tx){ pa.push({x,y, vx:0, vy:-40, l:1, c:'#ffd86b', tx}); }
function hd(){
  $('sc').textContent=fa(sc);
  $('lv').textContent=fa(lv);
  $('hp').textContent='♥'.repeat(Math.max(lives,0))+'♡'.repeat(3-Math.max(lives,0));
}

/* ===== منطق بازی ===== */
function ov(h){ const o=$('ov'); o.innerHTML=h; o.hidden=!h; }

function menu(){
  mode='menu';
  ov(`<div class="card"><h1>شب‌تابِ ریسمان</h1><p>شب‌تاب کوچک را در راستای ریسمان نورانی بکش؛ به جلو و حتی عقب.<br>ستاره‌ها را جمع کن، از سایه‌های رقصان بگذر و نورت را زنده نگه دار.</p>${best?`<p>رکورد: <b>${fa(best)}</b></p>`:''}<button class="btn" id="go" type="button">شروع بازی</button></div>`);
  $('go').onclick=start;
}
function start(){
  ia();
  lv=1; sc=0; lives=3; en=1; s=0; combo=0; rv=0; tr=[]; moved=0; inv=0;
  nl();
  $('hint').style.opacity=1;
  mode='play'; ov(''); hd();
}
function over(m){
  mode='over';
  if(sc>best){ best=sc; try{localStorage.setItem('shabtab',best)}catch(e){} }
  if(++games%3===0) AdHooks.interstitial();
  ov(`<div class="card"><h1>${m}</h1><p>امتیاز: <b>${fa(sc)}</b> · مرحله ${fa(lv)}<br>رکورد: ${fa(best)}</p>${rv?'':'<button class="btn alt" id="rw" type="button">🎬 ادامه با دیدن تبلیغ (یک جان اضافه)</button>'}<button class="btn" id="go" type="button">بازی دوباره</button></div>`);
  $('go').onclick=start;
  const r=$('rw');
  if(r) r.onclick=()=>AdHooks.rewarded(()=>{
    rv=1; lives=1; en=.6; inv=2;
    ov(''); mode='play'; hd();
  });
}
function hit(){
  lives--; combo=0; inv=1.2;
  s=Math.max(0, s-80/TL);
  en=Math.max(0, en-.1);
  boom();
  if(navigator.vibrate) navigator.vibrate(60);
  burst(P.x,P.y,'#ff6b9d');
  hd();
  if(lives<=0) over('سایه‌ها بردند!');
}
function win(){
  mode='wait';
  const b=100*lv+Math.round(en*100); sc+=b;
  [0,2,4,5,7].forEach((n,i)=>setTimeout(()=>nt(n+2,.5,'triangle',.2), i*110));
  pop(W/2,H/2,'مرحله کامل! +'+fa(b));
  hd();
  setTimeout(()=>{
    lv++; s=0; en=1; tr=[]; nl(); hd(); mode='play';
  },1500);
}

function up(dt){
  t+=dt;
  P=pos(s);
  G.forEach(g=>{
    const a=Math.sin(g.w*t+g.p)*g.A,
          b=lv>2?Math.cos(g.w*t+g.p)*g.A*.5:0;
    g.ox=g.x-g.ty*a+g.tx*b;
    g.oy=g.y+g.tx*a+g.ty*b;
  });
  pa=pa.filter(q=>(q.l-=dt)>0);
  pa.forEach(q=>{ q.x+=q.vx*dt; q.y+=q.vy*dt; });

  if(mode!=='play'){
    if(hg&&AC){ try{ hg.gain.setTargetAtTime(0, AC.currentTime, .1); }catch(e){} }
    return;
  }

  let c=kv;
  if(drag) c=((drag.x-drag.sx)*P.tx+(drag.y-drag.sy)*P.ty)/(Math.min(W,H)*.12);
  v=Math.abs(c)<.1?0:K((c-Math.sign(c)*.1)/.9, -1, 1);
  if(v&&!moved){ moved=1; $('hint').style.opacity=0; }

  if(hg&&hum&&AC){
    try{
      hg.gain.setTargetAtTime(mute?0:.05*Math.abs(v), AC.currentTime, .05);
      hum.frequency.setTargetAtTime(180*Math.pow(2,s*1.5), AC.currentTime, .05);
    }catch(e){}
  }

  s=K(s+v*Math.min(W,H)*.7*dt/TL, 0, 1);
  P=pos(s);
  en-=(.014+.002*lv)*dt;
  inv-=dt;
  tr.push([P.x,P.y]); if(tr.length>16) tr.shift();

  if(inv<=0)
    for(const g of G)
      if(Math.hypot(g.ox-P.x, g.oy-P.y)<OR+PR*.7){ hit(); break; }

  if(mode!=='play') return;

  S.forEach(q=>{
    if(!q.got && Math.hypot(q.x-P.x,q.y-P.y)<24){
      q.got=1; combo++;
      const p=10*Math.min(combo,10);
      sc+=p; en=Math.min(1,en+.07);
      nt(combo-1,.5);
      burst(q.x,q.y,'#ffd86b');
      pop(q.x,q.y-10,'+'+fa(p));
      hd();
    }
  });
  if(s>=1) win();
  else if(en<=0) over('نور شب‌تاب خاموش شد');
}

/* ===== رسم ===== */
function pp(n){
  cx.beginPath();
  cx.moveTo(D[0][0], D[0][1]);
  for(let i=1;i<n;i++) cx.lineTo(D[i][0], D[i][1]);
}
function dr(){
  cx.clearRect(0,0,W,H);
  cx.fillStyle='#fff';
  for(const b of BG){
    cx.globalAlpha=.2+.25*Math.sin(t*b[3]+b[2]);
    cx.fillRect(b[0]*W, b[1]*H, b[4], b[4]);
  }
  cx.globalAlpha=1;
  cx.lineCap=cx.lineJoin='round';
  pp(D.length);
  cx.strokeStyle='#5eead422'; cx.lineWidth=20; cx.stroke();
  cx.strokeStyle='#5eead477'; cx.lineWidth=3;  cx.stroke();

  const lim=s*TL; let i=0;
  while(i<D.length && CL[i]<=lim) i++;
  pp(i);
  cx.lineTo(P.x,P.y);
  cx.strokeStyle='#ffd86bcc'; cx.lineWidth=5; cx.stroke();

  const e=D[D.length-1];
  cx.strokeStyle='#ffd86b'; cx.lineWidth=2;
  cx.beginPath(); cx.arc(e[0], e[1], 14+3*Math.sin(t*3), 0, 6.28); cx.stroke();

  S.forEach((q,k)=>{
    if(q.got) return;
    const r=5+1.5*Math.sin(t*4+k);
    cx.fillStyle='#ffd86b33'; cx.beginPath(); cx.arc(q.x,q.y,r+7,0,6.28); cx.fill();
    cx.fillStyle='#fff3b0'; cx.beginPath(); cx.arc(q.x,q.y,r,0,6.28); cx.fill();
  });
  G.forEach(g=>{
    cx.fillStyle='#ff6b9d26';
    cx.beginPath(); cx.arc(g.ox,g.oy,OR+9,0,6.28); cx.fill();
    cx.fillStyle='#150a29'; cx.strokeStyle='#ff6b9d'; cx.lineWidth=3;
    cx.beginPath(); cx.arc(g.ox,g.oy,OR,0,6.28); cx.fill(); cx.stroke();
    const a=Math.atan2(P.y-g.oy, P.x-g.ox), ex=Math.cos(a)*3, ey=Math.sin(a)*3;
    cx.fillStyle='#fff';
    [-5,5].forEach(o=>{ cx.beginPath(); cx.arc(g.ox+o, g.oy-3, 4, 0, 6.28); cx.fill(); });
    cx.fillStyle='#150a29';
    [-5,5].forEach(o=>{ cx.beginPath(); cx.arc(g.ox+o+ex*.6, g.oy-3+ey*.6, 2, 0, 6.28); cx.fill(); });
  });
  tr.forEach((p,k)=>{
    const f=k/tr.length;
    cx.fillStyle=`rgba(255,216,107,${f*.35})`;
    cx.beginPath(); cx.arc(p[0], p[1], PR*f, 0, 6.28); cx.fill();
  });

  if(!(inv>0 && Math.floor(t*14)%2)){
    const x=P.x, y=P.y+(mode==='menu'?Math.sin(t*3)*3:0),
          w=.5+.5*Math.sin(t*40);
    cx.fillStyle=`rgba(255,216,107,${.12+.2*en})`;
    cx.beginPath(); cx.arc(x,y,PR*3.2,0,6.28); cx.fill();
    cx.fillStyle='#ffffff88';
    [-1,1].forEach(d=>{
      cx.beginPath();
      cx.ellipse(x+d*PR*.8, y-PR*.5, PR*.9*(.4+.6*w), PR*.35, d*.6, 0, 6.28);
      cx.fill();
    });
    cx.fillStyle='#ffe98a'; cx.beginPath(); cx.arc(x,y,PR,0,6.28); cx.fill();
  }

  cx.textAlign='center'; cx.font='bold 17px Tahoma,sans-serif';
  pa.forEach(q=>{
    cx.globalAlpha=K(q.l*1.4,0,1);
    cx.fillStyle=q.c;
    if(q.tx) cx.fillText(q.tx, q.x, q.y);
    else{ cx.beginPath(); cx.arc(q.x, q.y, 2.5, 0, 6.28); cx.fill(); }
  });
  cx.globalAlpha=1;
  $('bi').style.width=K(en,0,1)*100+'%';
}

/* ===== ورودی ===== */
cv.addEventListener('pointerdown',e=>{
  ia();
  drag={sx:e.clientX, sy:e.clientY, x:e.clientX, y:e.clientY};
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(drag){ drag.x=e.clientX; drag.y=e.clientY; }
});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>drag=null));

addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowRight'||k==='ArrowUp'){ e.preventDefault(); kv=1; }
  else if(k==='ArrowLeft'||k==='ArrowDown'){ e.preventDefault(); kv=-1; }
  else if((k===' '||k==='Enter') && mode!=='play' && !$('ov').hidden){
    const go=$('go'); if(go){ e.preventDefault(); go.click(); }
  } else if(k==='m'||k==='M'){ $('mu').click(); }
});
addEventListener('keyup',e=>{
  if(['ArrowRight','ArrowUp','ArrowLeft','ArrowDown'].includes(e.key)) kv=0;
});

let lt=0;
function lp(ts){
  const dt=Math.min((ts-lt)/1000||0, .05);
  lt=ts;
  up(dt); dr();
  requestAnimationFrame(lp);
}
rs(); nl(); hd(); menu();
requestAnimationFrame(lp);
